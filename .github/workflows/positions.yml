# Rebuilds positions/ (exact map positions matched from OpenStreetMap) and cuisine/ once a month
# and commits the result. Run it by hand from the Actions tab with "Run workflow".
name: Refresh map positions

on:
  schedule:
    - cron: '0 3 2 * *'   # 03:00 UTC on the 2nd of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commits
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      - name: Build positions (whole UK)
        run: python -u tools/build_positions.py --out positions

      - name: Build cuisines (OpenStreetMap, Overture Maps, names)
        # If this fails the old cuisines stay, the new positions are still committed, and the last step
        # marks the run as failed so GitHub sends a failure email.
        id: cuisine
        continue-on-error: true
        run: python -u tools/build_cuisine.py --out cuisine

      - name: Commit if changed
        run: |
          # index.json always gets a new build date, so only commit when a district file changed.
          if git diff --quiet -- positions cuisine ':(exclude)positions/index.json' ':(exclude)cuisine/index.json' && [ -z "$(git ls-files --others --exclude-standard positions cuisine)" ]; then
            echo "No position changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A positions cuisine
          git commit -m "Refresh map positions and cuisines"
          git pull --rebase origin main
          git push

      - name: Fail the run if the cuisine build failed
        if: steps.cuisine.outcome == 'failure'
        run: |
          echo "The cuisine build failed; the previous cuisines were kept. See the 'Build cuisines' step above."
          exit 1
